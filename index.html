<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All the Best & Good Luck</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        .message {
            font-size: 18px;
            color: #333;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <h1>All the Best & Good Luck!</h1>
    <div id="messages"></div>

    <script>
        const container = document.getElementById('messages');
        const message = 'All the Best and Good Luck!';
        for (let i = 0; i < 1000; i++) {
            const p = document.createElement('p');
            p.className = 'message';
            p.textContent = message;
            container.appendChild(p);
        }
    </script>
</body>
</html>
